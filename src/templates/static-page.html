<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <title>{{title}} — Nic Milligan Creative</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:type" content="{{og_type}}">
  <script type="application/ld+json">{{json_ld}}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@0..100,100..900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap">
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/static-page.css">
</head>
<body class="static-page">
  <header class="site-header">
    <a href="/" class="back-link" aria-label="Back to Nic Milligan Creative">&larr; Nic Milligan Creative</a>
    <button class="static-theme-toggle" id="static-theme-toggle" type="button" aria-label="Switch to dark theme">DARK</button>
  </header>
  <main class="page-content">
    {{content}}
  </main>
  <script>
    (function () {
      var btn = document.getElementById('static-theme-toggle');
      if (!btn) return;
      var root = document.documentElement;
      function apply(theme) {
        root.setAttribute('data-theme', theme);
        try { localStorage.setItem('theme', theme); } catch (e) {}
        var next = theme === 'dark' ? 'light' : 'dark';
        btn.textContent = next.toUpperCase();
        btn.setAttribute('aria-label', 'Switch to ' + next + ' theme');
      }
      apply(root.getAttribute('data-theme') || 'light');
      btn.addEventListener('click', function () {
        apply(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
      });
    })();
  </script>
</body>
</html>
