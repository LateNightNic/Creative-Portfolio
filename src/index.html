<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nic Milligan Creative</title>
  <meta name="description" content="The creative portfolio of Nic Milligan — design, motion, and interactive work.">
  <base href="/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:ROND,wght@0..100,100..900&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/windows.css">
  <link rel="stylesheet" href="css/static-page.css">
</head>
<body>

  <header class="taskbar" role="banner">
    <div class="taskbar__left">
      <div class="taskbar__menu">
        <button
          class="taskbar__menu-trigger"
          id="taskbar-menu-trigger"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="taskbar-menu"
        >
          Nic Milligan Creative
        </button>
        <ul class="taskbar__menu-panel" id="taskbar-menu" role="menu" aria-labelledby="taskbar-menu-trigger" hidden>
          <li role="none">
            <button class="taskbar__menu-item" role="menuitem" data-action="reset-desktop">Reset Desktop</button>
          </li>
          <li role="none">
            <button class="taskbar__menu-item" role="menuitem" data-action="close-windows">Close Windows</button>
          </li>
        </ul>
      </div>
    </div>
    <div class="taskbar__right">
      <div class="taskbar__social-menu">
        <button
          class="taskbar__social-trigger"
          id="taskbar-social-trigger"
          aria-expanded="false"
          aria-controls="taskbar-social"
          aria-label="Social links"
        >
          <span class="taskbar__social-trigger-bar" aria-hidden="true"></span>
          <span class="taskbar__social-trigger-bar" aria-hidden="true"></span>
          <span class="taskbar__social-trigger-bar" aria-hidden="true"></span>
        </button>
        <nav class="taskbar__social" id="taskbar-social" aria-label="Social links">
          <a class="taskbar__social-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <img src="images/social-icons/icon-Instagram.svg" alt="" />
            <span class="taskbar__social-link-label" aria-hidden="true">Instagram</span>
          </a>
          <a class="taskbar__social-link" href="https://www.linkedin.com/in/nicmilligan/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
            <img src="images/social-icons/icon-LinkedIn.svg" alt="" />
            <span class="taskbar__social-link-label" aria-hidden="true">LinkedIn</span>
          </a>
          <a class="taskbar__social-link" href="https://x.com/_LateNightNic#" target="_blank" rel="noopener noreferrer" aria-label="Twitter / X">
            <img src="images/social-icons/icon-X.svg" alt="" />
            <span class="taskbar__social-link-label" aria-hidden="true">Twitter / X</span>
          </a>
          <a class="taskbar__social-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
            <img src="images/social-icons/icon-Youtube.svg" alt="" />
            <span class="taskbar__social-link-label" aria-hidden="true">YouTube</span>
          </a>
        </nav>
      </div>
      <div class="taskbar__clock" aria-hidden="true"></div>
    </div>
  </header>

  <main class="desktop" aria-label="Desktop">
    <div class="icon-grid" role="list">

      <button class="desktop-icon" data-app="projects" role="listitem" aria-label="Open Work">
        <div class="desktop-icon__graphic" aria-hidden="true">
          <img src="images/temp-Icons/temp-MyProjects.png" alt="" draggable="false">
        </div>
        <span class="desktop-icon__label">Work</span>
      </button>

      <button class="desktop-icon" data-app="playground" role="listitem" aria-label="Open Playground">
        <div class="desktop-icon__graphic" aria-hidden="true">
          <img src="images/temp-Icons/temp-Playground.png" alt="" draggable="false">
        </div>
        <span class="desktop-icon__label">Playground</span>
      </button>

      <button class="desktop-icon" data-app="contact" role="listitem" aria-label="Open Contact">
        <div class="desktop-icon__graphic" aria-hidden="true">
          <img src="images/temp-Icons/temp-Contact.png" alt="" draggable="false">
        </div>
        <span class="desktop-icon__label">Contact</span>
      </button>

      <button class="desktop-icon" data-app="about" role="listitem" aria-label="Open About">
        <div class="desktop-icon__graphic" aria-hidden="true">
          <img src="images/temp-Icons/temp-AboutMe.png" alt="" draggable="false">
        </div>
        <span class="desktop-icon__label">About</span>
      </button>

      <button class="desktop-icon" data-app="blog" role="listitem" aria-label="Open Blog">
        <div class="desktop-icon__graphic" aria-hidden="true">
          <img src="images/temp-Icons/temp-Blog.png" alt="" draggable="false">
        </div>
        <span class="desktop-icon__label">Blog</span>
      </button>

      <button class="desktop-icon" data-app="resume" role="listitem" aria-label="Open Resume">
        <div class="desktop-icon__graphic" aria-hidden="true">
          <img src="images/temp-Icons/temp-Resume.png" alt="" draggable="false">
        </div>
        <span class="desktop-icon__label">Resume</span>
      </button>

    </div>
  </main>

  <div id="windows" aria-live="polite"></div>

  <template id="window-template">
    <div class="window" role="dialog" aria-modal="true">
      <div class="window__inner">
        <div class="window__titlebar">
          <span class="window__titlebar-hatch" aria-hidden="true"></span>
          <span class="window__title"></span>
          <div class="window__titlebar-right">
            <span class="window__titlebar-hatch" aria-hidden="true"></span>
            <div class="window__controls">
              <button class="window__control window__control--minimize" aria-label="Minimize window" hidden>&minus;</button>
              <button class="window__control window__control--maximize" aria-label="Maximize window" aria-pressed="false"></button>
              <button class="window__control window__control--close" aria-label="Close window">&times;</button>
            </div>
          </div>
        </div>
        <div class="window__content"></div>
      </div>
      <div class="window__resize-right" aria-hidden="true"></div>
      <div class="window__resize-bottom" aria-hidden="true"></div>
      <div class="window__resize-corner" aria-hidden="true"></div>
    </div>
  </template>

  <script type="module" src="js/main.js"></script>
</body>
</html>
